name: Finalize rewritten SEO
on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: seo-voice-rewrite-finalize
  cancel-in-progress: false
jobs:
  finalize:
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check the exact published article blobs and record final statuses
        env:
          PAGES_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          PAGES_RUN_ID: ${{ github.event.workflow_run.id }}
          PAGES_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node scripts/seo-geo-voice-rewrite-finalize.mjs
