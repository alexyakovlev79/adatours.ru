name: Fetch Costa hero source

on:
  push:
    paths:
      - ".github/workflows/fetch-costa-hero.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Probe and fetch exact source hero
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          candidates=(
            "https://brasiltours.ru/image/countries/costa-rica/novye-foto/oblozhki/la-fortuna.jpg"
            "https://brasiltours.ru/image/countries/costa-rica/novye-foto/oblozhki/la-fortuna.jpeg"
            "https://brasiltours.ru/image/countries/costa-rica/novye-foto/oblozhki/la-fortuna.png"
            "https://brasiltours.ru/image/countries/costa-rica/novye-foto/oblozhki/la-fortuna.webp"
            "https://brasiltours.ru/image/countries/costa-rica/novye-foto/la-fortuna.jpg"
            "https://brasiltours.ru/image/countries/costa-rica/novye-foto/la-fortuna.jpeg"
            "https://brasiltours.ru/image/countries/costa-rica/novye-foto/la-fortuna.png"
            "https://brasiltours.ru/image/countries/costa-rica/novye-foto/la-fortuna.webp"
          )
          : > out/probe.txt
          found=""
          for u in "${candidates[@]}"; do
            rm -f /tmp/candidate
            meta=$(curl --silent --show-error --location --retry 2 \
              --write-out "%{http_code}|%{content_type}|%{url_effective}" \
              --output /tmp/candidate "$u" || true)
            mime=$(file --brief --mime-type /tmp/candidate 2>/dev/null || true)
            size=$(stat -c%s /tmp/candidate 2>/dev/null || echo 0)
            printf '%s | %s | %s | %s\n' "$u" "$meta" "$mime" "$size" >> out/probe.txt
            if [[ -z "$found" && "$mime" == image/* ]]; then
              cp /tmp/candidate out/source-image
              printf '%s\n' "$u" > out/source-url.txt
              found="$u"
            fi
          done
          cat out/probe.txt
          test -n "$found"
          file out/source-image
      - name: Convert exact source hero to production WebP
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -i out/source-image \
            -c:v libwebp -quality 88 -compression_level 6 out/hero.webp
          test -s out/hero.webp
          file out/hero.webp
          sha256sum out/hero.webp
      - name: Upload hero artifact
        uses: actions/upload-artifact@v4
        with:
          name: costa-rica-source-hero-v2
          path: |
            out/hero.webp
            out/source-url.txt
            out/probe.txt
          if-no-files-found: error
          retention-days: 1
