name: One-time recovery of Geovani source photo to S3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-geovani-s3.yml

permissions:
  contents: read
  id-token: write

jobs:
  recover:
    name: Move exact Geovani original to S3 with SHA-256 receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YC_SA_ID: ${{ vars.YC_MEDIA_SA_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Exchange repository OIDC token for temporary Yandex Cloud token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${YC_SA_ID:-}" || { echo "::error::Missing YC_MEDIA_SA_ID"; exit 1; }
          oidc_json="$(curl --fail --silent --show-error --get \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=https://github.com/alexyakovlev79" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          oidc_token="$(jq -er '.value' <<< "${oidc_json}")"
          echo "::add-mask::${oidc_token}"
          iam_file="$(mktemp)"
          status="$(curl --silent --show-error \
            -o "$iam_file" -w '%{http_code}' \
            -X POST 'https://auth.yandex.cloud/oauth/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_SA_ID}" \
            --data-urlencode "subject_token=${oidc_token}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          if [[ "$status" != 200 ]]; then
            code="$(jq -r '.error // .code // .error_code // "unknown"' "$iam_file" 2>/dev/null | head -c 80 || true)"
            detail="$(jq -r '.error_description // .message // "no description"' "$iam_file" 2>/dev/null | head -c 250 | sed -E 's/[A-Za-z0-9_-]{70,}/[redacted]/g' || true)"
            echo "::error::Yandex OAuth HTTP $status; error=$code; detail=$detail"
            exit 1
          fi
          iam_json="$(cat "$iam_file")"
          rm -f "$iam_file"
          iam_token="$(jq -er '.access_token' <<< "${iam_json}")"
          echo "::add-mask::${iam_token}"
          echo "YC_IAM_TOKEN=${iam_token}" >> "${GITHUB_ENV}"
      - name: Upload and verify exact original; do not claim GPT Image enhancement
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const file='public/media/people/geovani/geovani-20261030.webp';
          const bytes=await fs.readFile(file);
          const sha=x=>createHash('sha256').update(x).digest('hex');
          if(!bytes.length||bytes.toString('ascii',0,4)!=='RIFF'||bytes.toString('ascii',8,12)!=='WEBP')
            throw Error('Invalid source WebP');
          const digest=sha(bytes);
          const key='media/people/geovani/geovani-original-20261030-'+digest.slice(0,12)+'.webp';
          const storage='https://storage.yandexcloud.net/img.adatours.ru/'+key;
          const publicUrl='https://img.adatours.ru/'+key;
          const head=await fetch(publicUrl,{method:'HEAD'});
          let result;
          if(head.status===200){result='already-existing';}
          else if(head.status===403||head.status===404){
            const put=await fetch(storage,{method:'PUT',headers:{
              Authorization:'Bearer '+process.env.YC_IAM_TOKEN,
              'If-None-Match':'*','Content-Type':'image/webp',
              'Content-Length':String(bytes.length),
              'x-amz-meta-sha256':digest,
              'Cache-Control':'public, max-age=31536000, immutable'
            },body:bytes});
            if(!put.ok)throw Error('S3 PUT failure HTTP '+put.status);
            result='uploaded';
          }else throw Error('Unexpected public HEAD HTTP '+head.status);
          const get=await fetch(publicUrl,{cache:'no-store'});
          if(!get.ok)throw Error('S3 file not readable HTTP '+get.status);
          const verify=Buffer.from(await get.arrayBuffer());
          if(sha(verify)!==digest||verify.length!==bytes.length)
            throw Error('S3 SHA or byte length mismatch');
          const receipt={version:1,assets:[{key,sha256:digest,bytes:bytes.length,
            contentType:'image/webp',uploadedAt:new Date().toISOString(),source:'direct-s3'}],
            result,githubSha:process.env.GITHUB_SHA};
          await fs.writeFile('geovani-original-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log('VERIFIED_GEO_SOURCE='+JSON.stringify(receipt));
          console.log('SOURCE_PENDING_GPT_IMAGE: original safely stored; no enhancement was performed');
          NODE
      - name: Correct portrait lighting and upscale without changing identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/geovani-venv"
          "$RUNNER_TEMP/geovani-venv/bin/python" -m pip install --quiet 'Pillow==11.3.0'
          "$RUNNER_TEMP/geovani-venv/bin/python" - <<'PY'
          from PIL import Image, ImageEnhance, ImageFilter
          from hashlib import sha256
          from pathlib import Path
          import os
          source = Path('public/media/people/geovani/geovani-20261030.webp')
          assert sha256(source.read_bytes()).hexdigest() == '6f7b681e037e1c23d327ef0061c667c4c8edc77498bd9fddc3382d31ff9ff7d2'
          im = Image.open(source).convert('RGB')
          assert im.size == (200, 267)
          im = ImageEnhance.Brightness(im).enhance(1.20)
          im = ImageEnhance.Contrast(im).enhance(1.075)
          im = ImageEnhance.Color(im).enhance(0.87)
          im = im.resize((600,801), Image.Resampling.LANCZOS)
          im = im.filter(ImageFilter.UnsharpMask(radius=1.2,percent=88,threshold=3))
          im.save(Path(os.environ['RUNNER_TEMP'])/'geovani-corrected.webp','WEBP',quality=91,method=6)
          print('CORRECTED_600x801_NON_GENERATIVE: not GPT Image')
          PY

      - name: Upload corrected portrait to S3 and verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const bytes = await fs.readFile(process.env.RUNNER_TEMP+'/geovani-corrected.webp');
          const sha = x => createHash('sha256').update(x).digest('hex');
          if (bytes.toString('ascii',0,4)!=='RIFF' || bytes.toString('ascii',8,12)!=='WEBP') throw Error('Not WebP');
          const hash=sha(bytes);
          const key='media/people/geovani/geovani-corrected-20261030-'+hash.slice(0,12)+'.webp';
          const pub='https://img.adatours.ru/'+key;
          const storage='https://storage.yandexcloud.net/img.adatours.ru/'+key;
          const head=await fetch(pub,{method:'HEAD'});
          let result;
          if(head.status===200)result='already-existing';
          else if(head.status===403||head.status===404){
            const put=await fetch(storage,{method:'PUT',headers:{
              Authorization:'Bearer '+process.env.YC_IAM_TOKEN,
              'If-None-Match':'*','Content-Type':'image/webp',
              'Content-Length':String(bytes.length),'x-amz-meta-sha256':hash,
              'Cache-Control':'public, max-age=31536000, immutable'
            },body:bytes});
            if(!put.ok)throw Error('Corrected S3 PUT HTTP '+put.status);
            result='uploaded';
          }else throw Error('Unexpected S3 HEAD HTTP '+head.status);
          const get=await fetch(pub,{cache:'no-store'});
          if(!get.ok)throw Error('Corrected S3 GET HTTP '+get.status);
          const readback=Buffer.from(await get.arrayBuffer());
          if(readback.length!==bytes.length||sha(readback)!==hash)
            throw Error('S3 corrected SHA-256 readback mismatch');
          const receipt={version:1,assets:[{key,sha256:hash,bytes:bytes.length,
            contentType:'image/webp',uploadedAt:new Date().toISOString(),source:'direct-s3'}],
            result,correction:'non-generative-lighting-color-upscale',
            width:600,height:801,originalKey:'media/people/geovani/geovani-original-20261030-6f7b681e037e.webp'};
          await fs.writeFile('geovani-corrected-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log('VERIFIED_GEO_CORRECTED='+JSON.stringify(receipt));
          console.log('GPT_IMAGE_NOT_DONE: This is a conventional correction, not a generated image');
          NODE

      - name: Save verified corrected image receipt
        uses: actions/upload-artifact@v4
        with:
          name: geovani-corrected-receipt-${{ github.run_id }}
          path: geovani-corrected-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Save verified original receipt
        uses: actions/upload-artifact@v4
        with:
          name: geovani-original-receipt-${{ github.run_id }}
          path: geovani-original-receipt.json
          if-no-files-found: error
          retention-days: 7
