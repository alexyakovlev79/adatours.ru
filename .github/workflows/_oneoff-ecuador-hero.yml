name: One-off Ecuador hero

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_oneoff-ecuador-hero.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate production hero asset
        shell: bash
        env:
          SOURCE_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-de5c-820a-a0a0-4fbba12324b5/raw?se=2026-10-07T15%3A37%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=ec053436-1610-5c6b-82ea-c2723c436ad9&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T03%3A48%3A46Z&ske=2026-10-08T03%3A48%3A46Z&sks=b&skv=2026-02-06&sig=7jvSwrMNyzb30Ybx5fk7HSQ9fRj9qmY1t%2BO%2BVmbTfP0%3D"
        run: |
          set -euo pipefail
          curl -fL "$SOURCE_URL" -o /tmp/active-ecuador-hero.png
          test -s /tmp/active-ecuador-hero.png
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          target="public/media/tours/aktivnyj-ekvador-i-trekking/hero-src-enhanced-20261007-v2.webp"
          mkdir -p "$(dirname "$target")"
          cwebp -quiet -q 70 -crop 0 60 1536 864 /tmp/active-ecuador-hero.png -o "$target"
          test -s "$target"

          python - <<'PY'
          from pathlib import Path
          import json

          old = "/media/tours/aktivnyj-ekvador-i-trekking/hero-src-enhanced-20261007.webp"
          new = "/media/tours/aktivnyj-ekvador-i-trekking/hero-src-enhanced-20261007-v2.webp"

          md_path = Path("src/content/tours/aktivnyj-ekvador-i-trekking.md")
          md = md_path.read_text(encoding="utf-8")
          needle = f'  src: "{old}"'
          if needle not in md:
              raise SystemExit(f"old hero not found in {md_path}")
          md_path.write_text(md.replace(needle, f'  src: "{new}"', 1), encoding="utf-8")

          reg_path = Path("src/data/media/photo-enhancements.json")
          data = json.loads(reg_path.read_text(encoding="utf-8"))
          found = False
          for row in data.get("enhancements", []):
              if row.get("enhanced") == old:
                  row["enhanced"] = new
                  row["enhancedAt"] = "2026-10-07"
                  row["method"] = "gpt-image"
                  row["revision"] = int(row.get("revision", 1)) + 1
                  found = True
                  break
          if not found:
              data.setdefault("enhancements", []).append({
                  "source": new,
                  "enhanced": new,
                  "enhancedAt": "2026-10-07",
                  "method": "gpt-image",
                  "revision": 1
              })
          reg_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          rm -f .github/workflows/_oneoff-ecuador-hero.yml

      - name: Commit generated hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate hero for Active Ecuador trekking"
          git push origin HEAD:main
