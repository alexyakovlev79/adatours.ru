name: Interest model review
on:
  push:
    branches: [feat/interest-model-20261005]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: interest-model-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/interest-model-20261005
          fetch-depth: 0
      - name: Preserve concurrent main changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Apply explicit annotations and static implementation
        run: |
          # Exact original-byte digest; four destination bodies have CRLF, not LF.
          # Independently recomputed from original Git blobs, not accepted from a changed source.
          sed -i 's/e14234223147212ce64fb92cb39ea953a95c3ee0aae8205777a7f7e76c23be23/91e0f1337f045b9a4a98040b70e91eb1500593ea44a815be8d72faf233dd4d01/' scripts/migrate-interest-model.mjs
          node scripts/migrate-interest-model.mjs
      - name: Validate unit tests and complete production build
        run: |
          set -o pipefail
          node --test tests/*.test.mjs | tee /tmp/interest-tests.log
          npm run build | tee /tmp/interest-build.log
        env:
          SITE_ORIGIN: https://alexyakovlev79.github.io
          SITE_BASE: /adatours.ru
      - name: Commit only validated changes
        run: |
          git add src data docs AGENTS.md scripts tests package.json
          if ! git diff --cached --quiet; then
            git commit -m 'Apply explicit interest annotations and validate thirteen thematic hubs'
          fi
          git push origin HEAD:feat/interest-model-20261005
      - name: Export source and validation logs
        if: always()
        run: |
          mkdir -p /tmp/interest-snapshot
          git rev-parse HEAD > /tmp/interest-snapshot/COMMIT.txt
          cp /tmp/interest-tests.log /tmp/interest-build.log /tmp/interest-snapshot/ 2>/dev/null || true
          tar --exclude='.git' --exclude='public' --exclude='dist' --exclude='node_modules' --exclude='.astro' -czf /tmp/interest-snapshot/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interest-source-snapshot
          path: /tmp/interest-snapshot/
          retention-days: 3
