name: Ada EN shared excursion ownership audit
on:
  push:
    branches: [feat/english-site-foundation]
    paths:
      - 'scripts/i18n/audit-shared-excursion-owners.mjs'
      - '.github/workflows/i18n-shared-excursions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/english-site-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install YAML parser
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build unique translation owners without modifying Tours
        run: node scripts/i18n/audit-shared-excursion-owners.mjs . --output data/i18n/shared-excursion-owners
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ada-shared-excursion-owners
          path: data/i18n/shared-excursion-owners/
          if-no-files-found: warn
          retention-days: 30
      - name: Save canonical shared-Excursion ownership in feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/i18n/shared-excursion-owners
          if git diff --cached --quiet; then echo 'Already checkpointed'; exit 0; fi
          git commit -m 'data(i18n): freeze unique owners for shared excursion translations'
          git push origin HEAD:feat/english-site-foundation

