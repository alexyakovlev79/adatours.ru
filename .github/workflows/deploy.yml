name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - data/media/upload-session-request.json
  workflow_dispatch:
  schedule:
    # December 31 at 21:05 UTC = January 1 at 00:05 Moscow time.
    - cron: '5 21 31 12 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_ORIGIN: https://adatours.ru
  SITE_BASE: /
  MEDIA_CDN_ORIGIN: https://img.adatours.ru

jobs:
  media:
    name: Verify S3 receipts and enforce no new Git media
    runs-on: ubuntu-latest
    env:
      MEDIA_LEGACY_CUTOFF: b09b6ba01316e888e871eac399d98eb9915d2bf7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Load frozen Git media tree
        shell: bash
        run: |
          set -euo pipefail
          if ! git cat-file -e "${MEDIA_LEGACY_CUTOFF}^{tree}" 2>/dev/null; then
            git fetch --no-tags --filter=blob:none --depth=1 origin "${MEDIA_LEGACY_CUTOFF}"
          fi
      - name: Verify no binary media was added to Git
        run: node scripts/guard-no-new-git-media.mjs
      - name: Verify every new direct-S3 object is present and matches its receipt
        run: node scripts/verify-direct-s3-assets.mjs

  build:
    needs: media
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install, build, and upload Astro site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  report:
    name: Publish deployment result as commit status
    if: always()
    needs: [media, build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Record media, build and Pages result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MEDIA_RESULT: ${{ needs.media.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [[ "$MEDIA_RESULT" == "success" && "$BUILD_RESULT" == "success" && "$DEPLOY_RESULT" == "success" ]]; then
            status="success"
            note="S3 verification, Astro build and Pages deploy succeeded"
          else
            status="failure"
            note="S3=$MEDIA_RESULT, build=$BUILD_RESULT, Pages=$DEPLOY_RESULT"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$status" -f context="ada/pages-deploy" -f description="$note" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
