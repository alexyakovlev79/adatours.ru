name: Probe wine tour images

on:
  push:
    branches:
      - chatgpt-write-probe-20261001
    paths:
      - ".github/workflows/probe-next-tour-images.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source images
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://brasiltours.ru/image/countries/argentina/new-photos/sergey-mikheev-bztskecromg-unsplash-oblozhka.jpg"
            "https://brasiltours.ru/image/buenos.png"
            "https://brasiltours.ru/image/countries/argentina/arg-geral-right.jpg"
            "https://brasiltours.ru/image/mendoza%20cerro%20delaglori.png"
            "https://brasiltours.ru/image/wine%20tour.png"
            "https://brasiltours.ru/image/countries/argentina/mendoza-sm.jpg"
            "https://brasiltours.ru/image/santiag.png"
            "https://brasiltours.ru/image/valparaiso%20chil.png"
            "https://brasiltours.ru/image/countries/chile/chi-santiago-right.jpg"
            "https://brasiltours.ru/image/santiago-de-chile.png"
          )
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1))
            f="/tmp/img-$i"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$u" --output "$f"
            mime=$(file --brief --mime-type "$f")
            size=$(stat -c%s "$f")
            echo "$i | $mime | $size | $u"
            [[ "$mime" == image/* ]]
            [[ "$size" -gt 1000 ]]
          done
