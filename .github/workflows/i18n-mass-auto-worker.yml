name: ADA EN mass autonomous API worker
run-name: ADA EN auto worker ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Idempotent five-minute UTC window
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: ada-en-worker-${{ inputs.dispatch_id }}
  cancel-in-progress: false
jobs:
  translate:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            /scripts/i18n/
            /data/i18n/translation-mass-auto-dispatch.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate worker code and prevent duplicate run in same time slot
        id: unique
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/i18n/translation-mass-api-worker.mjs
          node --check scripts/i18n/translation-mass-auto-dispatcher.mjs
          matching="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/i18n-mass-auto-worker.yml/runs?event=workflow_dispatch&per_page=100" \
            --jq '.workflow_runs[] | select(.display_title == ("ADA EN auto worker " + env.DISPATCH_ID)) | .id' 2>/dev/null || true)"
          oldest="$(printf '%s\n' "$matching" | grep -E '^[0-9]+$' | sort -n | head -1 || true)"
          if [[ -n "$oldest" && "$oldest" != "$CURRENT_RUN" ]]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Duplicate five-minute dispatch; no claim."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Translate up to ten sequential packets, using existing atomic CAS
        if: steps.unique.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADA_EN_MODEL: ${{ vars.ADA_EN_MODEL }}
          ADA_WORD_DRIVE_ACCESS_TOKEN: ${{ secrets.ADA_WORD_DRIVE_ACCESS_TOKEN }}
          ADA_WORD_DRIVE_REFRESH_TOKEN: ${{ secrets.ADA_WORD_DRIVE_REFRESH_TOKEN }}
          ADA_WORD_DRIVE_CLIENT_ID: ${{ secrets.ADA_WORD_DRIVE_CLIENT_ID }}
          ADA_WORD_DRIVE_CLIENT_SECRET: ${{ secrets.ADA_WORD_DRIVE_CLIENT_SECRET }}
        run: node scripts/i18n/translation-mass-api-worker.mjs
      - name: Preserve complete translated packet only if CAS submit was unconfirmed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ada-en-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ada-en-worker-recovery.json
          if-no-files-found: ignore
          retention-days: 7
