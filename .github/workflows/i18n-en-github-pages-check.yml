name: EN GitHub Pages route and deployment preflight (no upload)
on:
  push:
    branches: [feat/english-site-foundation]
    paths:
      - 'src/pages/en/**'
      - 'src/pages/en-pilot-private/**'
      - 'src/lib/i18n/**'
      - 'src/components/i18n/**'
      - 'src/components/global/SiteHeader.astro'
      - 'src/components/global/SiteFooter.astro'
      - 'src/components/forms/LeadForm.astro'
      - 'src/layouts/BaseLayout.astro'
      - 'astro.config.mjs'
      - 'scripts/i18n/verify-en-pages-site.mjs'
      - 'scripts/i18n/prepare-en-pages-site.mjs'
      - 'tests/i18n/en-staging-site.test.mjs'
      - 'tests/i18n/en-pages-one-source.test.mjs'
      - '.github/workflows/en-pages-reusable-deploy.yml'
      - 'infra/en-pages-repository/.github/workflows/deploy.yml'
      - '.github/workflows/i18n-en-github-pages-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: en-pages-source-check
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_LOCALE: en
      SITE_ORIGIN: https://alexyakovlev79.github.io
      SITE_BASE: /adatours-en/
      EN_STAGING_PAGES: '1'
      PUBLIC_EN_RELEASE: '0'
      EN_PILOT_PREVIEW: '0'
      MEDIA_CDN_ORIGIN: https://img.adatours.ru
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/english-site-foundation
          path: website
      - uses: actions/checkout@v4
        with:
          ref: ab27248954bb71fe6582bf796d73626ea8502d5f
          path: source-preview
      - uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore immutable EN Tour text and verify all canonical sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source-preview rev-parse HEAD)" = "ab27248954bb71fe6582bf796d73626ea8502d5f"
          mkdir -p website/data/i18n/pilot-previews/v1
          cp -a source-preview/data/i18n/pilot-previews/v1/. website/data/i18n/pilot-previews/v1/
          cd website
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          for(const id of ['tour_brazil_rio_four_days','tour_chile_easter_island_3_days_2027','tour_colombia_essential_5_days']){
            const map=JSON.parse(fs.readFileSync('data/i18n/block-maps/tours/'+id+'.json','utf8'));
            if(createHash('sha256').update(fs.readFileSync('../production/'+map.sourceContentPath)).digest('hex')!==map.ruBlobSha256)
              throw Error('Public RU Tour changed since EN translation: '+id);
          }
          import {verifyPrivateExcursionSourceFiles} from './src/lib/i18n/private-excursions.mjs';
          import {verifyPrivateGeoSources} from './src/lib/i18n/private-geography.mjs';
          if(await verifyPrivateExcursionSourceFiles('../production','.')!==11)throw Error('Outdated Excursion');
          if(await verifyPrivateGeoSources('../production','.')!==7)throw Error('Outdated geography');
          NODE
      - name: Build EN route tree at dedicated GitHub project base
        working-directory: website
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check scripts/i18n/verify-en-pages-site.mjs
          node --check scripts/i18n/prepare-en-pages-site.mjs
          node --test tests/i18n/en-staging-site.test.mjs tests/i18n/en-pages-one-source.test.mjs
          npx astro build
          node scripts/i18n/verify-en-pages-site.mjs dist
          node scripts/i18n/prepare-en-pages-site.mjs dist ../en-pages-site
          test "$(find ../en-pages-site/en -name index.html | wc -l)" -eq 22
      - name: Confirm this source repository did not deploy or overwrite RU Pages
        run: |
          test ! -e en-pages-site/CNAME
          test ! -e en-pages-site/tours/index.html
          echo "Deployment is owned by the separate adatours-en Pages repository."
