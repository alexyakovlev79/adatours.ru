name: Fetch temporary photo enhancement sources

on:
  push:
    paths:
      - '.github/workflows/fetch-photo-enhancement-sources.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact raw source photos
        shell: bash
        run: |
          set -euo pipefail
          dir='tmp/photo-enhancement-inputs/20261005-next40'
          mkdir -p "$dir"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/1/4/1472538871_beedad6983_o.jpg' -o "$dir/bokete-gallery-1.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/b/o/boquete_2.jpg' -o "$dir/bokete-gallery-2.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/a/n/antigua-cathedral-ruins.jpg' -o "$dir/bokete-gallery-3.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/c/h/ch-boquete-29.jpg' -o "$dir/bokete-gallery-4.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/countries/panama/6.jpg' -o "$dir/david-hero.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/3/5/358738904_c9a70ba3fd_o.jpg' -o "$dir/david-gallery-1.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/1/3/1360881041_242ec5b0e3_o.jpg' -o "$dir/david-gallery-2.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/B/N/BN20162_15.jpg' -o "$dir/david-gallery-3.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/2/1/2192858437_f721139f22_b.jpg' -o "$dir/david-gallery-4.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/B/N/BN22200_1.jpg' -o "$dir/david-gallery-5.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/2/1/2193619956_65c743c7e0_b.jpg' -o "$dir/david-gallery-6.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/B/N/BN20162_30.jpg' -o "$dir/david-gallery-7.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/countries/panama/8.jpg' -o "$dir/pearl-islands-hero.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/countries/panama/5.jpg' -o "$dir/colon-hero.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/B/N/BN7007_8_1.jpg' -o "$dir/colon-gallery-1.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/B/N/BN4156_8_1.jpg' -o "$dir/colon-gallery-2.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/B/N/BN3170_10_1.jpg' -o "$dir/colon-gallery-3.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/B/N/BN3170_13.jpg' -o "$dir/panama-city-gallery-1.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/B/N/BN3648_33.jpg' -o "$dir/panama-city-gallery-2.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/B/N/BN3648_42.jpg' -o "$dir/panama-city-gallery-3.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/B/N/BN3648_39.jpg' -o "$dir/panama-city-gallery-4.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/B/N/BN22200_13.jpg' -o "$dir/panama-city-gallery-5.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/B/N/BN3648_41.jpg' -o "$dir/panama-city-gallery-6.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/B/N/BN4156_2.jpg' -o "$dir/panama-city-gallery-7.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/countries/panama/11.jpg' -o "$dir/portobelo-hero.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/8/6/868677836_554fdbbf9f_b.jpg' -o "$dir/portobelo-gallery-1.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/2/4/242920413_0a768c3d1e_o.jpg' -o "$dir/portobelo-gallery-2.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/9/1/919054634_9bcb079d40_o.jpg' -o "$dir/portobelo-gallery-3.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/2/5/2593194143_fd046bc502_o.jpg' -o "$dir/portobelo-gallery-4.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/4/7/476839733_06f17403c4_b.jpg' -o "$dir/portobelo-gallery-5.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/2/2/2200154323_ebfeb1aa9b_o.jpg' -o "$dir/portobelo-gallery-6.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/countries/panama/7.jpg' -o "$dir/el-valle-hero.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/9/3/93845615_d1f31e31af_o_1.jpg' -o "$dir/el-valle-gallery-1.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/1/0/1005159996_a59d820711_b_1.jpg' -o "$dir/el-valle-gallery-2.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/1/0/1004372412_ad3ee2ecdc_b_1.jpg' -o "$dir/el-valle-gallery-3.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/2/3/2302014521_a10ba027cc_b_1.jpg' -o "$dir/el-valle-gallery-4.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/2/0/2093114174_f9f962280e_b_1.jpg' -o "$dir/el-valle-gallery-5.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/4/9/498912502_fec52d13a8_b_1.jpg' -o "$dir/el-valle-gallery-6.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/B/N/BN6530_4.jpg' -o "$dir/asuncion-gallery-1.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://brasiltours.ru/image/catalog/category/B/N/BN6530_1.jpg' -o "$dir/asuncion-gallery-2.jpg"
          file "$dir"/*
      - name: Upload exact-source artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-enhancement-sources-20261005-next40
          path: tmp/photo-enhancement-inputs/20261005-next40
          if-no-files-found: error
          retention-days: 1
      - name: Commit temporary source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/photo-enhancement-inputs/20261005-next40
          git diff --cached --quiet && exit 0
          git commit -m 'chore: stage exact source photos for 40-image enhancement batch [skip ci]'
          git push
