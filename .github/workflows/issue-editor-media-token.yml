name: Request encrypted S3 session for authorized GitHub editors

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: ada-editor-media-token-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.repository == 'alexyakovlev79/adatours.ru' &&
      startsWith(github.event.issue.title, '[ADA-MEDIA-TOKEN] ') &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - name: Checkout uploader allowlist at issue event revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            data/media/authorized-uploaders.json
          sparse-checkout-cone-mode: false
      - name: Check real GitHub author without requesting a cloud token
        id: auth
        env:
          MEDIA_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cfg = JSON.parse(fs.readFileSync('data/media/authorized-uploaders.json', 'utf8'));
          if (!Array.isArray(cfg.allowedGithubLogins)) throw Error('Invalid S3 uploader allowlist');
          const allowed = cfg.allowedGithubLogins.includes(process.env.MEDIA_ISSUE_AUTHOR);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'authorized=' + String(allowed) + '\n');
          console.log(allowed ? 'Uploader authorized' : 'Uploader is not on the allowlist');
          NODE

  request:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - name: Checkout trusted request validator at issue event revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            data/media/authorized-uploaders.json
            scripts/lib/media-token-envelope.mjs
          sparse-checkout-cone-mode: false
      - name: Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate original GitHub author and strict public request
        id: validate
        env:
          MEDIA_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          MEDIA_ISSUE_TITLE: ${{ github.event.issue.title }}
          MEDIA_ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {validateSessionRequest} from './scripts/lib/media-token-envelope.mjs';
          const check = (ok, why) => { if (!ok) throw Error(why); };
          const cfg = JSON.parse(fs.readFileSync('data/media/authorized-uploaders.json','utf8'));
          check(Array.isArray(cfg.allowedGithubLogins)
            && cfg.allowedGithubLogins.includes(process.env.MEDIA_ISSUE_AUTHOR),
            'GitHub author is not an authorized S3 uploader');
          const match = /^\[ADA-MEDIA-TOKEN\] ([0-9a-f]{32})$/.exec(process.env.MEDIA_ISSUE_TITLE || '');
          check(match, 'Title must be [ADA-MEDIA-TOKEN] <requestId>');
          const body = process.env.MEDIA_ISSUE_BODY || '';
          check(Buffer.byteLength(body, 'utf8') <= 4096, 'Request too large');
          const req = JSON.parse(body);
          const fields = ['bucket','createdAt','recipientPublicKey','requestId','version'];
          check(req && !Array.isArray(req) &&
            Object.keys(req).sort().join(',') === fields.join(','), 'Unexpected request fields');
          check(req.requestId === match[1], 'Request ID differs between title and body');
          validateSessionRequest(req);
          const file = path.join(process.env.RUNNER_TEMP, 'media-editor-' + req.requestId + '.json');
          fs.writeFileSync(file, JSON.stringify(req) + '\n', {mode:0o600, flag:'wx'});
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'file=' + file + '\nrequest_id=' + req.requestId + '\n');
          console.log('Validated editor upload request ' + req.requestId);
          NODE

      - name: Dispatch existing proven OIDC token issuer (no cloud credentials here)
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_FILE: ${{ steps.validate.outputs.file }}
          REQUEST_ID: ${{ steps.validate.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          # The trusted issuer is the ONLY GitHub workflow that exchanges OIDC for S3 IAM.
          # Skip redispatch of the same requestId, including manual job retries.
          titles="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/issue-media-upload-token.yml/runs?event=workflow_dispatch&per_page=100" --jq '.workflow_runs[].display_title')"
          if grep -Fxq "S3 media session $REQUEST_ID" <<< "$titles"; then
            echo "dispatch=already-requested" >> "$GITHUB_OUTPUT"
            echo "An existing issuer run already has this requestId"
          else
            gh workflow run issue-media-upload-token.yml --ref main \
              -f request_json="$(cat "$REQUEST_FILE")" \
              -f request_id="$REQUEST_ID"
            echo "dispatch=requested" >> "$GITHUB_OUTPUT"
            echo "Requested trusted issuer for requestId $REQUEST_ID"
          fi

      - name: Report dispatch accurately (not S3 upload success)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REQUEST_ID: ${{ steps.validate.outputs.request_id }}
          STATUS: ${{ steps.dispatch.outputs.dispatch }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Проверка GitHub-автора пройдена. Запрос $REQUEST_ID передан штатному выпускателю зашифрованных S3-токенов (статус: $STATUS). Найди запуск «S3 media session $REQUEST_ID» в Actions → Issue encrypted short-lived media upload token: https://github.com/$GITHUB_REPOSITORY/actions/workflows/issue-media-upload-token.yml . Только после успешного завершения этого запуска бери SEALED_MEDIA_TOKEN и загружай файл с локальным приватным ключом. Этот комментарий НЕ подтверждает выпуск токена, загрузку фото или Pages deploy."

      - name: Report failure without publishing secrets
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "S3-допуск НЕ выдан. Проверка запроса или отправка его штатному выпускателю не удалась: $RUN_URL . Не передавай приватный ключ и не публикуй ссылку на ещё не загруженное фото."
