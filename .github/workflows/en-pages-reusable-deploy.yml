name: Ada Tours English — reusable single-source Pages build
# This reusable workflow lives in the canonical adatours.ru source repository.
# It may be called only by the minimal deployment workflow in adatours-en.
on:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Never deploy from the Russian website's Pages repository
        shell: bash
        run: |
          test "${GITHUB_REPOSITORY}" = "alexyakovlev79/adatours-en" || {
            echo "::error::This workflow may publish only the dedicated EN Pages repository."
            exit 1
          }
  build:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: alexyakovlev79/adatours.ru
          ref: main
          path: website
          sparse-checkout: |
            /*
            !/public/media/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: alexyakovlev79/adatours.ru
          ref: ab27248954bb71fe6582bf796d73626ea8502d5f
          path: word-preview
          sparse-checkout: data/i18n/pilot-previews/v1
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: alexyakovlev79/adatours.ru
          ref: i18n/translation-mass-staging
          path: translation-preview
          sparse-checkout: |
            data/i18n/translation-mass/v2/index.json
            data/i18n/translation-mass/v2/state/
            data/i18n/translation-mass/v2/jobs/
            data/i18n/translation-mass/v2/results/
            data/i18n/fulltext-swarm/v1/manifest.json
            data/i18n/fulltext-swarm/v1/control.json
            data/i18n/fulltext-swarm/v1/definitions/
            data/i18n/fulltext-swarm/v1/state/
            data/i18n/fulltext-swarm/v1/results/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin the approved English source and restore accepted text overlays
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C word-preview rev-parse HEAD)" = "ab27248954bb71fe6582bf796d73626ea8502d5f"
          mkdir -p website/data/i18n/pilot-previews/v1
          cp -a word-preview/data/i18n/pilot-previews/v1/. website/data/i18n/pilot-previews/v1/
          echo "ADA_CANONICAL_SHA=$(git -C website rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C translation-preview checkout --detach "$(git -C translation-preview rev-parse HEAD)"
          echo "EN_MASS_SNAPSHOT_SHA=$(git -C translation-preview rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install, verify and build the one canonical Astro site
        working-directory: website
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_LOCALE: en
          SITE_ORIGIN: https://alexyakovlev79.github.io
          SITE_BASE: /adatours-en/
          EN_STAGING_PAGES: '1'
          EN_SHARED_CONTENT: '1'
          EN_ACCEPTED_TRANSLATIONS_ROOT: ../translation-preview
          EN_PUBLISH_SUBMITTED_TRANSLATIONS: '1'
          EN_PUBLISH_FULLTEXT: '1'
          PUBLIC_EN_RELEASE: '0'
          EN_PILOT_PREVIEW: '0'
          MEDIA_CDN_ORIGIN: https://img.adatours.ru
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_JS_API_KEY }}
          PUBLIC_GOOGLE_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test tests/i18n/fulltext-materializer.test.mjs tests/i18n/fulltext-publication-repairs.test.mjs
          node --test tests/i18n/en-staging-site.test.mjs tests/i18n/stage9-source-bound-tour-titles.test.mjs tests/i18n/stage9-tour-field-repairs.test.mjs tests/i18n/stage9-excursion-breadcrumbs.test.mjs
          node --check scripts/i18n/verify-en-pages-site.mjs
          node --check scripts/i18n/prepare-en-pages-site.mjs
          node --test tests/i18n/ru-fallback.test.mjs tests/i18n/progressive-locale.test.mjs tests/i18n/shared-*.test.mjs tests/i18n/media-captions-stage-six.test.mjs tests/i18n/schema-stage-eight.test.mjs tests/i18n/schema-noindex-publication.test.mjs tests/i18n/stage-five-company-proof.test.mjs tests/i18n/derived-catalog-localization.test.mjs
          node scripts/i18n/materialize-fulltext-en.mjs
          npx astro build
          node -e "const fs=require('node:fs');const html=fs.readFileSync('dist/index.html','utf8');const count=html.split('application/ld+json').length-1;console.log('EN_RAW_SCHEMA_ROOT_COUNT='+count);if(count!==1)throw Error('EN_SCHEMA_RAW_MISSING_OR_DUPLICATED')"
          npx pagefind --site dist --force-language en
          node scripts/dedupe-site-shell.mjs dist --skip-en
          node scripts/i18n/prepare-en-pages-site.mjs dist ../en-pages-site
          node scripts/i18n/verify-ru-fallback-output.mjs ../en-pages-site
          node scripts/i18n/verify-en-schema-output.mjs ../en-pages-site
          node scripts/i18n/audit-en-media-copy.mjs ../en-pages-site ../stage6-media-audit.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: en-pages-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish English routes only — never the Russian site
        id: pages
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000

