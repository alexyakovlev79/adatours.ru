name: ChatGPT photo audit temporary

on:
  push:
    branches:
      - chatgpt/photo-audit-20261005
    paths:
      - '.github/workflows/photo-audit-chatgpt.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --ignore-scripts js-yaml@4.3.2
      - name: Exact relevant queue
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readPhotoInputs, buildPhotoQueue } from './scripts/photo-queue.mjs';
          import { isPhotoEligible } from './src/lib/archive.mjs';
          const input = readPhotoInputs();
          const relevantTypes = new Set(['tour','destination','excursion']);
          const relevantEntries = input.entries.filter((e) => relevantTypes.has(e.type));
          const q = buildPhotoQueue({...input, entries: relevantEntries, all:true});
          const countryQ = buildPhotoQueue({...input, type:'country', all:true});
          const activeCounts = {};
          for (const type of ['tour','destination','excursion','country']) {
            activeCounts[type] = input.entries.filter((e)=>e.type===type && isPhotoEligible(e,input.contents.get(e.id))).length;
          }
          console.log('PHOTO_AUDIT_RELEVANT=' + JSON.stringify({
            activeCounts,
            relevantSelectedEntities:q.selectedEntityIds.length,
            relevantPendingUniqueSources:q.totalPendingSources,
            relevantReuseGroups:q.reuse.length,
            countryPendingUniqueSources:countryQ.totalPendingSources,
            countryReuseGroups:countryQ.reuse.length
          }));
          console.log('PHOTO_AUDIT_RELEVANT_FIRST50=' + JSON.stringify(q.photos.slice(0,50)));
          NODE
