name: Collect source-backed Tour and Excursion GEO passports
on:
  push:
    branches:
      - schema-geo/staging
    paths:
      - data/geo-knowledge/source-collector-dispatch.json
concurrency:
  group: geo-source-only-collector
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: node --check scripts/schema-geo-source-collector.mjs
      - name: Collect exact source-backed GEO results
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/schema-geo-source-collector.mjs
