name: Ada EN full Tour block-map audit
on:
  push:
    branches: [feat/english-site-foundation]
    paths:
      - 'scripts/i18n/export-all-tour-block-maps.mjs'
      - 'src/lib/i18n/block-map.mjs'
      - '.github/workflows/i18n-all-block-maps.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/english-site-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install YAML parser
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check Tour MD changes versus current main
        shell: bash
        run: |
          git fetch origin main --depth=3
          changed="$(git diff --name-only origin/main -- src/content/tours/)"
          if [[ -n "$changed" ]]; then
            echo "::error::Tour MD diverges from main; refresh source before generating block maps"
            echo "$changed"
            exit 1
          fi
      - name: Check 358 active Tour source maps and save manifest
        run: node scripts/i18n/export-all-tour-block-maps.mjs . --output data/i18n/block-maps/tours --write
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ada-all-tour-block-maps
          path: data/i18n/block-maps/tours/
          if-no-files-found: warn
          retention-days: 30
      - name: Checkpoint verified block maps in GitHub
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/i18n/block-maps/tours
          if git diff --cached --quiet; then echo 'All maps already committed'; exit 0; fi
          git commit -m 'data(i18n): freeze 358 stable Tour block maps from current shared facts'
          git push origin HEAD:feat/english-site-foundation

