name: Probe Patagonia hero

on:
  push:
    paths:
      - ".github/workflows/probe-patagonia-hero.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify raw hero
        shell: bash
        run: |
          set -euo pipefail
          url="https://brasiltours.ru/image/countries/argentina/new-photos/patagonia/perito-moreno-3.jpg"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output /tmp/hero
          test -s /tmp/hero
          mime=$(file --brief --mime-type /tmp/hero)
          size=$(stat -c%s /tmp/hero)
          dims=$(identify -format '%wx%h' /tmp/hero 2>/dev/null || true)
          echo "URL=$url"
          echo "MIME=$mime"
          echo "SIZE=$size"
          echo "DIMS=$dims"
          [[ "$mime" == image/* ]]
