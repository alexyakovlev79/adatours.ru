name: Publish homepage hero MP4 to Yandex Object Storage (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-home-video-once.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: ada-home-video-20261016
  cancel-in-progress: false

jobs:
  upload:
    name: Verified S3 transfer without a binary Git commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YC_SA_ID: ${{ vars.YC_MEDIA_SA_ID }}
      SOURCE_BLOB: 4b739eb24d6ea6adb3c1d200d567d950eca5ad57
      SOURCE_SHA256: d0a723ef80838c43f6630c700c71d4d89ba00e9885117280a92d9ecb7f5dbc85
      SOURCE_BYTES: '2572222'
      OBJECT_KEY: media/home/home-hero-20261016-v1.mp4
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Recover immutable temporary Git blob and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          video="$RUNNER_TEMP/ada-home-20261016.mp4"
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${SOURCE_BLOB}" --jq '.content' | base64 --decode > "$video"
          test "$(stat -c %s "$video")" = "$SOURCE_BYTES"
          printf '%s  %s\n' "$SOURCE_SHA256" "$video" | sha256sum -c -
          echo "VIDEO_PATH=$video" >> "$GITHUB_ENV"

      - name: Upload directly to Yandex S3 via existing encrypted OIDC process
        shell: bash
        run: |
          set -euo pipefail
          test -n "${YC_SA_ID:-}" || { echo "::error::YC_MEDIA_SA_ID is unavailable"; exit 1; }
          dir="$RUNNER_TEMP/ada-video-session"
          mkdir -p "$dir"
          node scripts/media-work-session.mjs init --out "$dir"
          request_file="$(find "$dir" -name '*.request.json' -print -quit)"
          private_file="$(find "$dir" -name '*.private.pem' -print -quit)"

          oidc_json="$(curl --fail --silent --show-error --get \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=https://github.com/alexyakovlev79" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          oidc_token="$(jq -er '.value' <<< "$oidc_json")"
          echo "::add-mask::$oidc_token"
          iam_json="$(curl --fail --silent --show-error \
            -X POST 'https://auth.yandex.cloud/oauth/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_SA_ID}" \
            --data-urlencode "subject_token=${oidc_token}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          iam_token="$(jq -er '.access_token' <<< "$iam_json")"
          echo "::add-mask::$iam_token"

          MEDIA_ENVELOPE_OUTPUT="$dir/envelope.json" \
            YC_MEDIA_IAM_TOKEN="$iam_token" \
            node scripts/issue-media-token.mjs "$request_file" >/dev/null

          node -e 'const fs=require("node:fs"); fs.writeFileSync(process.argv[1], JSON.stringify([{file:process.argv[2],key:process.argv[3]}]));' \
            "$dir/batch.json" "$VIDEO_PATH" "$OBJECT_KEY"
          packet="$(base64 -w 0 "$dir/envelope.json")"
          node scripts/media-work-session.mjs upload \
            --request "$request_file" \
            --private "$private_file" \
            --envelope "$packet" \
            --batch "$dir/batch.json" \
            --receipt "$dir/receipt.json"
          echo "RECEIPT_PATH=$dir/receipt.json" >> "$GITHUB_ENV"

      - name: Save small verification receipt, never the video
        uses: actions/upload-artifact@v4
        with:
          name: home-hero-video-s3-receipt-${{ github.run_id }}
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 7
