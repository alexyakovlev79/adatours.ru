name: Probe Buenos Aires Salta Iguazu images

on:
  push:
    branches:
      - chatgpt-write-probe-20261001
    paths:
      - ".github/workflows/probe-next-tour-images.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source images
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://brasiltours.ru/image/countries/argentina/bue.jpg"
            "https://brasiltours.ru/image/buenos%20aires4.png"
            "https://brasiltours.ru/image/Arg%20Buenos.png"
            "https://brasiltours.ru/image/countries/argentina/buenos.jpg"
            "https://brasiltours.ru/image/countries/argentina/excursiya-tigre-2.jpg"
            "https://brasiltours.ru/image/countries/argentina/rancho-gaucho11.png"
            "https://brasiltours.ru/image/countries/uruguay/montevideo-1680.jpg"
            "https://brasiltours.ru/image/countries/argentina/buenos-aires-copy.jpg"
            "https://brasiltours.ru/image/salta.jpg"
            "https://brasiltours.ru/image/Salta.png"
            "https://brasiltours.ru/image/countries/argentina/argentinian-meat.png"
            "https://brasiltours.ru/image/Foz%20do%20Iguau.png"
            "https://brasiltours.ru/image/Puerto%20Iguazu.png"
            "https://brasiltours.ru/image/Arg%20Buenos%20Aires.png"
            "https://brasiltours.ru/image/argentinian%20tango.png"
            "https://brasiltours.ru/image/countries/argentina/new-photos/pexels-joaquin-carfagna-14899674.jpg"
          )
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1))
            f="/tmp/img-$i"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$u" --output "$f"
            mime=$(file --brief --mime-type "$f")
            size=$(stat -c%s "$f")
            echo "$i | $mime | $size | $u"
            [[ "$mime" == image/* ]]
            [[ "$size" -gt 1000 ]]
          done
