name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_ORIGIN: https://adatours.ru
  SITE_BASE: /
  MEDIA_CDN_ORIGIN: https://img.adatours.ru

jobs:
  media:
    uses: ./.github/workflows/sync-media-to-object-storage.yml
    with:
      mode: delta
    permissions:
      contents: read
      id-token: write

  build:
    needs: media
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install, build, and upload Astro site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
