  push:
    branches: [main, feat/english-site-foundation]
    paths:
      - 'src/pages/en/**'
      - 'src/pages/en-pilot-private/**'
      - 'src/lib/i18n/**'
      - 'src/data/i18n/ui-copy.json'
      - 'src/data/i18n/tour-title-repairs.en.json'
      - 'src/data/i18n/tour-field-repairs.en.json'
      - 'tests/i18n/stage9-tour-field-repairs.test.mjs'
      - 'tests/i18n/stage9-excursion-breadcrumbs.test.mjs'
      - 'tests/i18n/stage9-source-bound-tour-titles.test.mjs'
      - 'scripts/i18n/audit-en-residuals.mjs'
      - 'scripts/i18n/stage9-browser-interactions.mjs'
      - 'scripts/i18n/classify-en-residual.mjs'
      - 'tests/i18n/stage9-residual-ui.test.mjs'
      - 'tests/i18n/stage9-residual-classification.test.mjs'
      - 'src/lib/vip-tours.mjs'
      - 'tests/i18n/derived-catalog-localization.test.mjs'
      - 'src/lib/seo-price-meta.mjs'
      - 'scripts/i18n/ru-fallback.mjs'
      - 'scripts/i18n/verify-en-schema-output.mjs'
      - 'scripts/i18n/verify-ru-fallback-output.mjs'
      - 'tests/i18n/schema-noindex-publication.test.mjs'
      - 'tests/i18n/ru-fallback.test.mjs'
      - 'tests/i18n/seo-stage-seven.test.mjs'
      - 'src/lib/page-schema.ts'
      - 'src/lib/structured-data.mjs'
      - 'tests/i18n/schema-stage-eight.test.mjs'
      - 'src/components/i18n/**'
      - 'src/components/global/SiteHeader.astro'
      - 'src/components/global/SiteFooter.astro'
      - 'src/components/forms/LeadForm.astro'
      - 'src/layouts/BaseLayout.astro'
      - 'src/layouts/EntityCatalogLayout.astro'
      - 'src/components/catalog/MultiCountryRelated.astro'
      - 'src/pages/multi-country/**'
      - 'src/pages/vip/**'
      - 'src/pages/index.astro'
      - 'src/layouts/ThemeLayout.astro'
      - 'src/layouts/CountryLayout.astro'
      - 'src/lib/interest-copy.mjs'
      - 'src/data/i18n/page-copy.en.json'
      - 'src/data/i18n/authority-*.en.json'
      - 'src/data/authority-pages.json'
      - 'src/pages/press/**'
      - 'src/pages/webinars/**'
      - 'src/pages/partners/**'
      - 'src/components/authority/**'
      - 'tests/i18n/authority-stage-four.test.mjs'
      - 'tests/i18n/commercial-stage-three.test.mjs'
      - 'tests/i18n/media-captions-stage-six.test.mjs'
      - 'src/data/i18n/media-captions.en.json'
      - 'scripts/i18n/audit-en-media-copy.mjs'
      - 'src/pages/country/**'
      - 'src/pages/interests/**'
      - 'src/pages/404.astro'
      - 'src/pages/privacy/**'
      - 'src/pages/personal-data/**'
      - 'src/pages/contacts/**'
      - 'astro.config.mjs'
      - 'scripts/i18n/verify-en-pages-site.mjs'
      - 'scripts/i18n/prepare-en-pages-site.mjs'
      - 'scripts/i18n/materialize-fulltext-en.mjs'
      - 'tests/i18n/fulltext-materializer.test.mjs'
      - 'scripts/i18n/fulltext-publication-repairs.mjs'
      - 'data/i18n/fulltext-publication-repairs/**'
      - 'tests/i18n/fulltext-publication-repairs.test.mjs'
      - 'tests/i18n/en-staging-site.test.mjs'
      - 'tests/i18n/en-pages-one-source.test.mjs'
      - '.github/workflows/en-pages-reusable-deploy.yml'
      - 'infra/en-pages-repository/.github/workflows/deploy.yml'
      - '.github/workflows/i18n-en-github-pages-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/i18n/**'
      - 'tests/i18n/**'
      - 'src/data/i18n/ui-copy.json'
      - 'src/lib/i18n/**'
      - 'src/lib/page-schema.ts'
      - 'src/lib/structured-data.mjs'
      - 'tests/i18n/schema-stage-eight.test.mjs'
      - 'src/components/i18n/**'
      - 'src/data/i18n/authority-*.en.json'
      - 'src/data/authority-pages.json'
      - 'src/pages/press/**'
      - 'src/pages/webinars/**'
      - 'src/pages/partners/**'
      - 'src/components/authority/**'
      - 'tests/i18n/authority-stage-four.test.mjs'
      - 'src/data/i18n/media-captions.en.json'
      - 'scripts/i18n/audit-en-media-copy.mjs'
      - 'src/components/tour/Itinerary.astro'
      - 'src/components/tour/TourPricing.astro'
      - 'src/pages/en/**'
      - 'src/pages/en-pilot-private/**'
      - 'src/layouts/BaseLayout.astro'
      - 'src/layouts/EntityCatalogLayout.astro'
      - 'src/components/catalog/MultiCountryRelated.astro'
      - 'src/pages/multi-country/**'
      - 'src/pages/vip/**'
      - 'src/pages/index.astro'
      - '.github/workflows/en-pages-reusable-deploy.yml'
      - '.github/workflows/i18n-en-github-pages-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: en-pages-source-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_LOCALE: en
      SITE_ORIGIN: https://alexyakovlev79.github.io
      SITE_BASE: /adatours-en/
      EN_STAGING_PAGES: '1'
      EN_SHARED_CONTENT: '1'
      EN_ACCEPTED_TRANSLATIONS_ROOT: ../translation-preview
      EN_PUBLISH_SUBMITTED_TRANSLATIONS: '1'
      EN_PUBLISH_FULLTEXT: '1'
      PUBLIC_EN_RELEASE: '0'
      EN_PILOT_PREVIEW: '0'
      MEDIA_CDN_ORIGIN: https://img.adatours.ru
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
          path: website
          sparse-checkout: |
            /*
            !/public/media/
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: ab27248954bb71fe6582bf796d73626ea8502d5f
          path: source-preview
          sparse-checkout: data/i18n/pilot-previews/v1
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: alexyakovlev79/adatours.ru
          ref: i18n/translation-mass-staging
          path: translation-preview
          sparse-checkout: |
            data/i18n/translation-mass/v2/index.json
            data/i18n/translation-mass/v2/state/
            data/i18n/translation-mass/v2/jobs/
            data/i18n/translation-mass/v2/results/
            data/i18n/fulltext-swarm/v1/manifest.json
            data/i18n/fulltext-swarm/v1/control.json
            data/i18n/fulltext-swarm/v1/definitions/
            data/i18n/fulltext-swarm/v1/state/
            data/i18n/fulltext-swarm/v1/results/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore immutable EN Tour text and preserve canonical source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source-preview rev-parse HEAD)" = "ab27248954bb71fe6582bf796d73626ea8502d5f"
          mkdir -p website/data/i18n/pilot-previews/v1
          cp -a source-preview/data/i18n/pilot-previews/v1/. website/data/i18n/pilot-previews/v1/
          echo "ADA_CANONICAL_SHA=$(git -C website rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C translation-preview checkout --detach "$(git -C translation-preview rev-parse HEAD)"
          echo "EN_MASS_SNAPSHOT_SHA=$(git -C translation-preview rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build EN route tree at dedicated GitHub project base
        working-directory: website
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test tests/i18n/fulltext-materializer.test.mjs tests/i18n/fulltext-publication-repairs.test.mjs
          node --check scripts/i18n/verify-en-pages-site.mjs
          node --check scripts/i18n/prepare-en-pages-site.mjs
          node --check scripts/i18n/audit-en-media-copy.mjs
          node --check scripts/i18n/audit-en-residuals.mjs
          node --test tests/i18n/stage9-residual-ui.test.mjs tests/i18n/stage9-residual-classification.test.mjs tests/i18n/stage9-source-bound-tour-titles.test.mjs tests/i18n/stage9-tour-field-repairs.test.mjs tests/i18n/stage9-excursion-breadcrumbs.test.mjs
          node --test tests/i18n/en-staging-site.test.mjs tests/i18n/en-pages-one-source.test.mjs tests/i18n/ru-fallback.test.mjs tests/i18n/progressive-locale.test.mjs tests/i18n/shared-*.test.mjs tests/i18n/page-copy-stage-two.test.mjs tests/i18n/remaining-ui-stage-one.test.mjs tests/i18n/media-captions-stage-six.test.mjs tests/i18n/authority-stage-four.test.mjs tests/i18n/schema-stage-eight.test.mjs tests/i18n/seo-stage-seven.test.mjs tests/i18n/schema-noindex-publication.test.mjs tests/i18n/derived-catalog-localization.test.mjs
          node scripts/i18n/materialize-fulltext-en.mjs
          npx astro build
          node -e "const fs=require('node:fs');const html=fs.readFileSync('dist/index.html','utf8');const count=html.split('application/ld+json').length-1;console.log('EN_RAW_SCHEMA_ROOT_COUNT='+count);if(count!==1)throw Error('EN_SCHEMA_RAW_MISSING_OR_DUPLICATED')"
          npx pagefind --site dist --force-language en
          node scripts/dedupe-site-shell.mjs dist --skip-en
          node scripts/i18n/prepare-en-pages-site.mjs dist ../en-pages-site
          node scripts/i18n/verify-ru-fallback-output.mjs ../en-pages-site
          node scripts/i18n/verify-en-schema-output.mjs ../en-pages-site
          node scripts/i18n/audit-en-residuals.mjs ../en-pages-site ../stage9-residual-audit.json ../stage9-residual-urls.ndjson ../stage9-js-sources.json
          node scripts/i18n/audit-en-media-copy.mjs ../en-pages-site ../stage6-media-audit.json
          test "$(find ../en-pages-site/en -name index.html | wc -l)" -ge 1022
      - name: Run source-SHA-bound browser checks on generated EN pages
        continue-on-error: true
        working-directory: website
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          node scripts/i18n/stage9-browser-interactions.mjs ../en-pages-site ../stage9-browser-interactions.json
      - name: Preserve experimental Stage 9 browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: en-stage9-browser-interactions
          path: stage9-browser-interactions.json
          if-no-files-found: warn

      - name: Confirm this source repository did not deploy or overwrite RU Pages
        run: |
          test ! -e en-pages-site/CNAME
          test ! -e en-pages-site/tours/index.html
          echo "Deployment is owned by the separate adatours-en Pages repository."


      - name: Save actual shared translation and route coverage receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: en-shared-translation-receipt
          path: |
            en-pages-site/translation-receipt.json
            stage6-media-audit.json
          if-no-files-found: error

      - name: Preserve stage-nine residual inventory even if other checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: en-stage9-complete-residual-inventory
          path: |
            stage9-residual-audit.json
            stage9-residual-urls.ndjson
            stage9-js-sources.json
          if-no-files-found: warn
