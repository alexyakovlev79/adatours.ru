name: One-time Geovani S3 photo metadata repair

on:
  push:
    branches: [feature/geovani-s3-photo-release-20261030]
    paths:
      - .github/workflows/geovani-photo-release-once.yml

permissions:
  contents: write

concurrency:
  group: geovani-photo-release-20261030
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'alexyakovlev79/adatours.ru'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/geovani-s3-photo-release-20261030
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify both photos exist in S3 and update only the required text records
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {mergeDirectAssetReceipts} from './scripts/lib/direct-media-ledger.mjs';
          const assets = [
            {key:'media/people/geovani/geovani-original-20261030-6f7b681e037e.webp',
             sha256:'6f7b681e037e1c23d327ef0061c667c4c8edc77498bd9fddc3382d31ff9ff7d2',
             bytes:2688,contentType:'image/webp',uploadedAt:'2026-10-30T13:41:24.596Z',source:'direct-s3'},
            {key:'media/people/geovani/geovani-corrected-20261030-27c4af0d02a7.webp',
             sha256:'27c4af0d02a7afb5fc50847e7698c6a7b1abd438ea7647a1eb0cc07182cfc489',
             bytes:35722,contentType:'image/webp',uploadedAt:'2026-10-30T14:13:07.592Z',source:'direct-s3'}
          ];
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          for (const asset of assets) {
            const response = await fetch('https://img.adatours.ru/'+asset.key, {cache:'no-store'});
            if (!response.ok) throw Error('S3 GET failed: '+asset.key+' HTTP '+response.status);
            const bytes=Buffer.from(await response.arrayBuffer());
            if(bytes.length!==asset.bytes||sha(bytes)!==asset.sha256)
              throw Error('S3 source or corrected image mismatched SHA-256: '+asset.key);
            console.log('VERIFIED_S3_SHA256='+asset.key);
          }
          const ledgerPath='src/data/media/direct-s3-uploads.json';
          const ledger=JSON.parse(fs.readFileSync(ledgerPath,'utf8'));
          const merged=mergeDirectAssetReceipts(ledger,{version:1,assets});
          fs.writeFileSync(ledgerPath,JSON.stringify(merged,null,2)+'\n');
          const teamPath='src/data/organization/team.json';
          const team=JSON.parse(fs.readFileSync(teamPath,'utf8'));
          const matches=team.members.filter(m=>m.id==='person_geovani');
          if(matches.length!==1)throw Error('Expected exactly one Geovani member');
          const member=matches[0];
          const old='/media/people/geovani/geovani-20261030.webp';
          const corrected='/media/people/geovani/geovani-corrected-20261030-27c4af0d02a7.webp';
          if(member.photo.src!==old&&member.photo.src!==corrected)
            throw Error('Unexpected Geovani image: '+member.photo.src);
          member.photo.src=corrected;
          member.photo.width=600;
          member.photo.height=801;
          fs.writeFileSync(teamPath,JSON.stringify(team,null,2)+'\n');
          console.log('TEAM_JSON_LINK='+corrected);
          console.log('Both image entries registered in direct-S3 ledger; NOT marked gpt-image');
          NODE
          git rm -- public/media/people/geovani/geovani-20261030.webp
          # Workflow is a one-time branch-only repair tool; do not ship it into main.
          git rm -- .github/workflows/geovani-photo-release-once.yml
          node scripts/verify-direct-s3-assets.mjs --local
          git diff --check
          git diff --cached --check
          git diff --numstat -- src/data/media/direct-s3-uploads.json
          # Guard against accidental rewriting of the 2.5MB ledger.
          CHANGES="$(git diff --numstat -- src/data/media/direct-s3-uploads.json | awk '{ print $1+$2 }')"
          test -z "$CHANGES" || test "$CHANGES" -le 150 || { echo "::error::Unexpected ledger churn: $CHANGES lines"; exit 1; }
      - name: Commit photo reference, verified S3 ledger and delete only the illegal new Git binary
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/media/direct-s3-uploads.json src/data/organization/team.json
          git diff --cached --check
          git commit -m 'fix(media): publish verified Geovani corrected S3 portrait and remove new Git binary'
          git push origin HEAD:feature/geovani-s3-photo-release-20261030
          echo "GEOVANI_TEXT_REPAIR_SHA=$(git rev-parse HEAD)"
