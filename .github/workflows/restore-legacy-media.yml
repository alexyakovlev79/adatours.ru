name: Diagnose legacy image hotlinking

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-legacy-media.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check image responses by referrer
        shell: bash
        run: |
          set -u
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          urls=(
            'https://brasiltours.ru/image/cache/countries/brazil/tild3463-3039-4366-b661-663030613337-thales-botelho-de-so-1920x1080.webp'
            'https://brasiltours.ru/image/cache/countries/brazil/new-pics/micaela-parente-1309093-unsplash-1920x1080.webp'
            'https://brasiltours.ru/image/cache/countries/brazil/new-pics/marcos-paulo-prado-ggfymhbe878-unsplash-1920x1080.webp'
          )
          for url in "${urls[@]}"; do
            echo "URL=$url"
            for mode in no-ref github-ref same-ref; do
              out="/tmp/${mode}.bin"
              case "$mode" in
                no-ref) refargs=() ;;
                github-ref) refargs=(-e 'https://alexyakovlev79.github.io/adatours.ru/strany/braziliya/') ;;
                same-ref) refargs=(-e 'https://brasiltours.ru/') ;;
              esac
              curl -sS -L -A "$UA" "${refargs[@]}" -o "$out" -w "$mode status=%{http_code} type=%{content_type} bytes=%{size_download}\n" "$url" || true
              file "$out" || true
            done
          done
