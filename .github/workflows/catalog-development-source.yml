name: Catalog development source snapshot
on:
  push:
    branches: [feature/multi-country-interests-20261016]
    paths: [.github/workflows/catalog-development-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Package tracked source only (no credentials or media)
        run: |
          python3 - <<'PY'
          import subprocess, zipfile
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('catalog-source.zip','w',zipfile.ZIP_DEFLATED) as out:
              for path in paths:
                  if path and ('/' not in path or path.startswith(('src/','scripts/','tests/','docs/workflows/','data/','.github/'))):
                      out.write(path)
          PY
          git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-development-source
          path: |
            catalog-source.zip
            source-commit.txt
          retention-days: 2
