name: Ada EN — seed complete translation queue
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/i18n/seed-mass-translation.mjs'
      - 'src/lib/i18n/translation-mass-plan.mjs'
      - 'tests/i18n/translation-mass-plan.test.mjs'
      - '.github/workflows/i18n-mass-seed.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/i18n/seed-mass-translation.mjs'
      - 'src/lib/i18n/translation-mass-plan.mjs'
      - '.github/workflows/i18n-mass-seed.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ada-en-mass-seed
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Read canonical website source without historic Git media
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: website
          sparse-checkout: |
            /*
            !/public/media/
          sparse-checkout-cone-mode: false
      - name: Fetch sealed 358-result matching CAS source
        uses: actions/checkout@v4
        with:
          ref: i18n/matching-staging
          path: matching
          sparse-checkout: data/i18n/matching/v1
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Fetch QA-ready pilot result receipts
        uses: actions/checkout@v4
        with:
          ref: i18n/translation-staging
          path: pilot
          sparse-checkout: data/i18n/translation/v1
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate bulk planner and build all source-bound packets offline
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm install --no-audit --no-fund
          node --test tests/i18n/translation-mass-plan.test.mjs
          node scripts/i18n/seed-mass-translation.mjs \
            --source "$PWD" \
            --matching "$PWD/../matching" \
            --pilot "$PWD/../pilot" \
            --source-sha "$(git rev-parse HEAD)" \
            --matching-sha "$(git -C ../matching rev-parse HEAD)" \
            --pilot-sha "$(git -C ../pilot rev-parse HEAD)" \
            --output "$PWD/../bulk-queue-output"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base='../bulk-queue-output/';
          const report=JSON.parse(fs.readFileSync(base+'preflight-report.json'));
          const index=JSON.parse(fs.readFileSync(base+'index.json'));
          const manifest=JSON.parse(fs.readFileSync(base+'manifest.json'));
          if(report.expectedTours!==358||report.preparedTours<300||
             report.preparedTours+report.staleTourCount!==358||
             manifest.remainingBlocks<20000||
             index.jobCount<2500||index.publicationEnabled!==false||
             index.dispatcherEnabled!==false)
            throw Error('Bulk translation scope or safety gate failed');
          console.log('Verified bulk preparation: '+JSON.stringify({
           sourceCommit:index.sourceCommit,tours:report.preparedTours,
           stale:report.staleTourCount,packets:index.jobCount,
           readyPilotBlocks:index.reusedReadyBlocks,
           queued:index.counts.queued,held:index.counts.held,
           publicationEnabled:index.publicationEnabled}));
          NODE
      - name: Freeze first immutable bulk queue in its own staging branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cd website
          branch=i18n/translation-mass-staging
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "::notice::Bulk queue already exists; refusing to overwrite receipts or leases."
            exit 0
          fi
          git switch -c "$branch"
          mkdir -p data/i18n/translation-mass/v2
          cp -a ../bulk-queue-output/. data/i18n/translation-mass/v2/
          git add data/i18n/translation-mass/v2
          git -c user.name='ada-en-queue' -c user.email='ada-en-queue@users.noreply.github.com' \
            commit -m 'i18n: seed full Tour bulk translation queue (no EN publication) [skip ci]'
          git push origin "HEAD:refs/heads/$branch"
          echo "Bulk queue branch created: $branch"
