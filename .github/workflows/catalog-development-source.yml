name: Save validated catalogue source
on:
  push:
    branches: [feature/multi-country-interests-20261016]
    paths: [.github/workflows/catalog-development-source.yml]
permissions:
  contents: write
concurrency:
  group: multi-country-interest-development
  cancel-in-progress: false
env:
  ASTRO_TELEMETRY_DISABLED: '1'
  SITE_ORIGIN: https://adatours.ru
  SITE_BASE: /
  MEDIA_CDN_ORIGIN: https://img.adatours.ru
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Preserve inputs and recover exact checked patch
        run: |
          mkdir -p /tmp/catalog-dev
          cp -r .catalog-dev /tmp/catalog-dev/payload
          cp -r .github/workflows /tmp/catalog-dev/topic-workflows
          git rev-parse HEAD > /tmp/catalog-dev/topic-sha
          python3 - <<'PY'
          import base64,lzma,hashlib,pathlib
          raw=''.join(pathlib.Path('.catalog-dev/patch-'+str(i)+'.b64').read_text().strip() for i in (1,2,3))
          patch=lzma.decompress(base64.b64decode(raw))
          assert hashlib.sha256(patch).hexdigest() == 'a2c4bc3c73041ee6a7c3c4a262e9eefb0c09c591a7d91d50cce59ce351a2cc30'
          pathlib.Path('/tmp/catalog-dev/source.patch').write_bytes(patch)
          PY
      - name: Reconstruct the exact source accepted by run 38865153903
        run: |
          git fetch --no-tags --depth=1 origin 8563c03db429b14a7c14d55c2dcb069c06e3924c
          git checkout --detach 8563c03db429b14a7c14d55c2dcb069c06e3924c
          git rev-parse HEAD > /tmp/catalog-dev/base-main-sha
          git apply --check --exclude=package.json /tmp/catalog-dev/source.patch
          git apply --index --exclude=package.json /tmp/catalog-dev/source.patch
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('package.json');data=json.loads(p.read_text());s=data['scripts']['build']
          assert 'tests/multi-country-combinations.test.mjs' in s and 'node scripts/check-multi-country-menu.mjs' in s
          s=s.replace('tests/multi-country-combinations.test.mjs','tests/multi-country-combinations.test.mjs tests/multi-country-catalog.test.mjs')
          s=s.replace('node scripts/check-multi-country-menu.mjs','node scripts/check-multi-country-menu.mjs && node scripts/check-multi-country-interests.mjs')
          data['scripts']['build']='npm run sync:multi-country && '+s
          data['scripts']['sync:multi-country']='node scripts/sync-multi-country-registries.mjs --write'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          for p in Path('src').rglob('*.astro'):
              s=p.read_text(); t=s.replace("/multi-country-catalog'", "/multi-country-catalog.ts'")
              if s!=t:p.write_text(t)
          for name in ['src/lib/multi-country-registry.mjs','scripts/check-multi-country-interests.mjs','tests/multi-country-catalog.test.mjs']:
              p=Path(name);s=p.read_text()
              rel='./catalog-pagination.ts' if name.startswith('src/lib') else '../src/lib/catalog-pagination.ts'
              s="import { CATALOG_PAGE_SIZE } from '"+rel+"';\n"+s
              s=s.replace('row.count / 10','row.count / CATALOG_PAGE_SIZE').replace('(page - 1) * 10, page * 10','(page - 1) * CATALOG_PAGE_SIZE, page * CATALOG_PAGE_SIZE')
              p.write_text(s)
          p=Path('docs/workflows/multi-country-interests.md')
          p.write_text(p.read_text().replace('по 10;', 'с общим `CATALOG_PAGE_SIZE` (сейчас 30);').replace('ItemList видимой десятки','ItemList видимой части'))
          p=Path('scripts/check-multi-country-menu.mjs');s=p.read_text().replace("assert.ok(expected.size > 0, 'Expected real multi-country combinations');\n",'').replace("const combinationHtml = readFileSync(join(root, names[0], 'index.html'), 'utf8');", "if (names.length) {\nconst combinationHtml = readFileSync(join(root, names[0], 'index.html'), 'utf8');").replace("console.log('Multi-country menu:","}\nconsole.log('Multi-country menu:");p.write_text(s)
          PY
          python3 /tmp/catalog-dev/payload/repair.py
          git add package.json src scripts tests docs/workflows
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Regenerate deterministic registries only (full build already passed)
        run: |
          npm install --no-audit --no-fund
          npm run sync:multi-country
          git add data/seo-geo/registry data/catalogues/multi-country.json data/external-identity/multi-country-catalogues.json
          git add -f docs/catalogues/multi-country.md
      - name: Record production blobs and transfer through the development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp -r /tmp/catalog-dev/payload .catalog-dev
          cp .github/workflows/deploy.yml .catalog-dev/production-deploy.yml
          python3 - <<'PY'
          import subprocess,json,pathlib
          run=lambda *args:subprocess.check_output(args,text=True).strip()
          base=pathlib.Path('/tmp/catalog-dev/base-main-sha').read_text().strip()
          tree=run('git','write-tree');files=[]
          for p in run('git','diff','--cached','--name-only',base).splitlines():
              if p.startswith('.catalog-dev/') or p=='.github/workflows/catalog-development-source.yml':continue
              old=subprocess.run(['git','rev-parse',base+':'+p],capture_output=True,text=True)
              files.append({'path':p,'mode':'100644','type':'blob','sha':run('git','rev-parse',tree+':'+p),'previousSha':old.stdout.strip() if old.returncode==0 else None})
          snapshot=json.loads(pathlib.Path('data/catalogues/multi-country.json').read_text())
          assert snapshot['fingerprint']=='ad599f971ce0d904692e4eede7469a79b3add355696313cec0b5819ec64e278b'
          report={'baseMain':base,'validatedRun':38865153903,'build':'passed before transport','counts':snapshot['counts'],'fingerprint':snapshot['fingerprint'],'files':files}
          pathlib.Path('/tmp/catalog-dev/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          pathlib.Path('.catalog-dev/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          rm -rf .github/workflows
          cp -r /tmp/catalog-dev/topic-workflows .github/workflows
          git add .github/workflows .catalog-dev
          tree=$(git write-tree)
          topic=$(cat /tmp/catalog-dev/topic-sha)
          sha=$(printf 'feat: retain validated catalogue source for atomic production publication\n' | git commit-tree "$tree" -p "$topic")
          git push origin "$sha:refs/heads/feature/multi-country-interests-20261016"
          echo "$sha" > /tmp/catalog-dev/prepared-sha
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-country-interest-transfer
          path: |
            /tmp/catalog-dev/report.json
            /tmp/catalog-dev/base-main-sha
            /tmp/catalog-dev/prepared-sha
            data/catalogues/multi-country.json
            public/data/multi-country-interests*.csv
            public/data/multi-country-seo-order.csv
          retention-days: 3
