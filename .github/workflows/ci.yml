name: Pull Request CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MEDIA_LEGACY_CUTOFF: b09b6ba01316e888e871eac399d98eb9915d2bf7
    env:
      MEDIA_CDN_ORIGIN: https://img.adatours.ru
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reject additions to frozen Git media; verify S3 receipt schema
        shell: bash
        run: |
          set -euo pipefail
          if ! git cat-file -e "${MEDIA_LEGACY_CUTOFF}^{tree}" 2>/dev/null; then
            git fetch --no-tags --filter=blob:none --depth=1 origin "${MEDIA_LEGACY_CUTOFF}"
          fi
          node scripts/guard-no-new-git-media.mjs
          node scripts/verify-direct-s3-assets.mjs --local

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lifecycle and unit tests
        run: |
          node scripts/sync-archives.mjs
          node --test tests/*.test.mjs > /tmp/unit-tests.log 2>&1 || { tail -60 /tmp/unit-tests.log; exit 1; }
          tail -12 /tmp/unit-tests.log

      - name: Build Astro and Pagefind
        shell: bash
        run: |
          if npm run build > /tmp/astro-build.log 2>&1; then
            tail -20 /tmp/astro-build.log
          else
            tail -35 /tmp/astro-build.log
            if test -f dist/schema-coverage.json; then
              node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('dist/schema-coverage.json')); console.log(JSON.stringify({...r,pages:undefined,errors:r.errors.slice(0,30)},null,2));"
            fi
            exit 1
          fi

      - name: Save schema acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-acceptance
          path: |
            dist/schema-coverage.json
            /tmp/astro-build.log
            /tmp/unit-tests.log
          if-no-files-found: ignore

      - name: Verify media offload in build output
        run: |
          test -f dist/media-offload-report.json
          cat dist/media-offload-report.json
          test ! -d dist/media
          grep -q 'https://img.adatours.ru/media/' dist/brazil/index.html
          node --input-type=module -e "import fs from 'node:fs'; const r = JSON.parse(fs.readFileSync('dist/media-offload-report.json')); if (r.excludedBytes < 1000000000 || r.redirectedReferences < 1000) process.exit(1);"

      - name: Search index smoke checks
        shell: bash
        run: |
          test -f dist/pagefind/pagefind.js
          grep -q 'data-pagefind-body' dist/brazil/index.html
          grep -q 'data-pagefind-body' dist/brazil/place/rio-de-janeiro/index.html
          ! grep -q 'data-pagefind-body' dist/index.html
          indexed_pages=$(grep -Rsl 'data-pagefind-body' dist --include='*.html' | wc -l)
          test "$indexed_pages" -ge 10

      - name: Verify archives remain accessible and excluded from public collections
        run: node scripts/verify-archive-output.mjs

      - name: Verify canonical routing
        run: node scripts/verify-routing-output.mjs
