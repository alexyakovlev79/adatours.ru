name: ADA EN three Tour full-block pilot validation
on:
  push:
    branches: [feat/english-site-foundation]
    paths:
      - 'scripts/i18n/compile-three-tour-pilot.mjs'
      - 'data/i18n/translation/pilot-completion-drafts/**'
      - '.github/workflows/i18n-three-tour-complete-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/english-site-foundation
          path: feature
      - uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - uses: actions/checkout@v4
        with:
          ref: i18n/translation-staging
          path: staging
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated pilot authoring dependencies
        working-directory: feature
        run: npm install --no-audit --no-fund
      - name: Check exact reviewed receipts and 142 additional EN slots
        run: |
          node feature/scripts/i18n/compile-three-tour-pilot.mjs feature production staging --output /tmp/ada-en-complete-pilot
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('/tmp/ada-en-complete-pilot/summary.json','utf8'));
          if(report.failures.length||report.reports.length!==3||
             report.totalSourceSlots!==172||report.totalReadyPrevious!==30||
             report.totalAdditional!==142||report.publicationAuthorized!==false||
             report.reports.some(t=>t.fullCoverage!==true||t.approved!==false||t.state!=='review'))
            throw Error('Incomplete/unsafe full-block pilot coverage');
          console.log('All 172 EN text slots have draft text; no missing Word evidence and no public release');
          NODE
      - name: Assemble three fully approved nonpublishing locale previews after source checks
        run: |
          node feature/scripts/i18n/compile-three-tour-pilot.mjs feature production staging --output /tmp/ada-en-approved-pilot --approve-drafts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='/tmp/ada-en-approved-pilot/';
          const data=JSON.parse(fs.readFileSync(root+'summary.json','utf8'));
          if(data.phase!=='approved_nonpublishing_pilot'||data.failures.length||
            data.totalSourceSlots!==172||data.totalReadyPrevious!==30||
            data.totalAdditional!==142||data.reports.length!==3||
            data.reports.some(r=>r.state!=='ready'||r.issues!==0||r.fullCoverage!==true)||
            data.publicationAuthorized!==false) throw Error('Incomplete approved pilot output');
          const ids=['tour_brazil_rio_four_days','tour_chile_easter_island_3_days_2027',
            'tour_colombia_essential_5_days'];
          for (const id of ids) {
            const item=JSON.parse(fs.readFileSync(root+'rendered/'+id+'.json','utf8'));
            const overlay=JSON.parse(fs.readFileSync(root+'overlays/'+id+'.json','utf8'));
            if(item.id!==id||item.locale!=='en'||item.data.id!==id||
              item.data.locale!=='en'||overlay.blocks.some(b=>b.state!=='approved')||
              /[\u0400-\u052F]/u.test(overlay.blocks.map(b=>b.text).join(' '))||
              item.data.itinerary.some(d=>d.text&&/[\u0400-\u052F]/u.test(d.text)))
               throw Error('Russian locale leak or unapproved text: '+id);
            console.log(id+': '+overlay.blocks.length+' approved text blocks, no visible RU fallback');
          }
          NODE
      - name: Save isolated approved EN pilot preview, no main deploy
        uses: actions/upload-artifact@v4
        with:
          name: ada-en-three-tour-locale-preview-qa
          path: /tmp/ada-en-approved-pilot/
          retention-days: 14
          if-no-files-found: error
      - name: Save nonpublishing complete-block review packets
        uses: actions/upload-artifact@v4
        with:
          name: ada-en-three-tour-full-coverage-review
          path: /tmp/ada-en-complete-pilot/
          retention-days: 14
          if-no-files-found: error
