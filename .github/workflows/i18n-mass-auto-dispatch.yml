name: ADA EN mass auto-dispatch (every 5 minutes)
run-name: ADA EN dispatcher ${{ github.run_id }}
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: ada-en-mass-auto-dispatch
  cancel-in-progress: false
jobs:
  check:
    if: false && github.repository == 'alexyakovlev79/adatours.ru'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            /scripts/i18n/
            /data/i18n/translation-mass-auto-dispatch.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check exact staging queue and request next worker if possible
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADA_WORD_DRIVE_ACCESS_TOKEN: ${{ secrets.ADA_WORD_DRIVE_ACCESS_TOKEN }}
          ADA_WORD_DRIVE_REFRESH_TOKEN: ${{ secrets.ADA_WORD_DRIVE_REFRESH_TOKEN }}
          ADA_WORD_DRIVE_CLIENT_ID: ${{ secrets.ADA_WORD_DRIVE_CLIENT_ID }}
          ADA_WORD_DRIVE_CLIENT_SECRET: ${{ secrets.ADA_WORD_DRIVE_CLIENT_SECRET }}
        run: |
          node --check scripts/i18n/translation-mass-auto-dispatcher.mjs
          node --check scripts/i18n/translation-mass-api-worker.mjs
          node scripts/i18n/translation-mass-auto-dispatcher.mjs
