name: SEO/GEO link diagnostic (manual only)

on:
  workflow_dispatch:
    inputs:
      article_path:
        description: 'Exact staging article path (data/seo-geo/articles/.../index.md)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: staging
          ref: seo-geo/staging
      - uses: actions/checkout@v6
        with:
          path: source
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install check dependencies only
        working-directory: source
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Diagnose one explicitly selected article
        env:
          ARTICLE_PATH: ${{ inputs.article_path }}
        run: |
          case "$ARTICLE_PATH" in
            data/seo-geo/articles/*/index.md) ;;
            *) echo 'Invalid article path'; exit 1 ;;
          esac
          node source/scripts/preflight-seo-geo-links.mjs --source-root source --staging-root staging --article "$ARTICLE_PATH"
