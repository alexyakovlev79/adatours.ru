name: Package first 10 original photo sources for GPT Image

on:
  push:
    paths:
      - '.github/workflows/fetch-photo-enhancement-sources.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact historical originals
        shell: bash
        run: |
          set -euo pipefail
          dir='tmp/gpt-image-originals/20261005-redo-01-10'
          mkdir -p "$dir"
          curl -fL --retry 2 --connect-timeout 20 'https://raw.githubusercontent.com/alexyakovlev79/adatours.ru/e49979d661e3d6c5b429d84905f0f9fb25c5f7a0/tmp/photo-enhancement-inputs/20261005-next50/001.jpg' -o "$dir/001.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://raw.githubusercontent.com/alexyakovlev79/adatours.ru/e49979d661e3d6c5b429d84905f0f9fb25c5f7a0/tmp/photo-enhancement-inputs/20261005-next50/002.jpg' -o "$dir/002.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://raw.githubusercontent.com/alexyakovlev79/adatours.ru/e49979d661e3d6c5b429d84905f0f9fb25c5f7a0/tmp/photo-enhancement-inputs/20261005-next50/003.jpg' -o "$dir/003.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://raw.githubusercontent.com/alexyakovlev79/adatours.ru/e49979d661e3d6c5b429d84905f0f9fb25c5f7a0/tmp/photo-enhancement-inputs/20261005-next50/004.jpg' -o "$dir/004.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://raw.githubusercontent.com/alexyakovlev79/adatours.ru/e49979d661e3d6c5b429d84905f0f9fb25c5f7a0/tmp/photo-enhancement-inputs/20261005-next50/005.jpg' -o "$dir/005.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://raw.githubusercontent.com/alexyakovlev79/adatours.ru/e49979d661e3d6c5b429d84905f0f9fb25c5f7a0/tmp/photo-enhancement-inputs/20261005-next50/006.jpg' -o "$dir/006.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://raw.githubusercontent.com/alexyakovlev79/adatours.ru/e49979d661e3d6c5b429d84905f0f9fb25c5f7a0/tmp/photo-enhancement-inputs/20261005-next50/007.jpg' -o "$dir/007.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://raw.githubusercontent.com/alexyakovlev79/adatours.ru/e49979d661e3d6c5b429d84905f0f9fb25c5f7a0/tmp/photo-enhancement-inputs/20261005-next50/008.jpg' -o "$dir/008.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://raw.githubusercontent.com/alexyakovlev79/adatours.ru/e49979d661e3d6c5b429d84905f0f9fb25c5f7a0/tmp/photo-enhancement-inputs/20261005-next50/009.jpg' -o "$dir/009.jpg"
          curl -fL --retry 2 --connect-timeout 20 'https://raw.githubusercontent.com/alexyakovlev79/adatours.ru/e49979d661e3d6c5b429d84905f0f9fb25c5f7a0/tmp/photo-enhancement-inputs/20261005-next50/010.jpg' -o "$dir/010.jpg"
          file "$dir"/*
      - name: Upload exact originals
        uses: actions/upload-artifact@v4
        with:
          name: gpt-image-originals-20261005-redo-01-10
          path: tmp/gpt-image-originals/20261005-redo-01-10
          if-no-files-found: error
          retention-days: 1
