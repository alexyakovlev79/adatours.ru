name: Preview five high-confidence Word duplicate archives
on:
  push:
    branches: [feat/archive-word-duplicates-20261030]
    paths:
      - 'data/audits/word-duplicates-20261030.json'
      - 'scripts/archive-confirmed-word-duplicates.mjs'
      - '.github/workflows/archive-word-duplicates-preview.yml'
      - 'package.json'
      - 'data/seo-geo/articles/**/index.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_ORIGIN: https://adatours.ru
      SITE_BASE: /
      MEDIA_CDN_ORIGIN: https://img.adatours.ru
      SOCIAL_PREVIEW_REQUIRED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/archive-word-duplicates-20261030
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Apply archive into temporary runner checkout only
        run: node scripts/archive-confirmed-word-duplicates.mjs --apply --report /tmp/ada-archive-preview
      - name: Check archive/source-index consistency and archive unit tests
        run: |
          node --test tests/archive.test.mjs
          node scripts/sync-archives.mjs
          node scripts/sync-source-catalogs.mjs
          git diff --check
      - name: Show exact SEO article migration scope before build
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir='/tmp/ada-archive-preview/';
          for (const name of ['summary','article-changes','dual-mentions']) {
            const value=JSON.parse(fs.readFileSync(dir+name+'.json','utf8'));
            console.log('ARCHIVE_PREVIEW_'+name.toUpperCase().replaceAll('-','_')+'='+JSON.stringify(value));
          }
          NODE
      - name: Full Astro build, sitemap, Pagefind and archived link verification
        run: npm run build
      - name: Summarize candidate changes
        run: git status --short
      - name: Save exact staged migration changes
        if: always()
        run: |
          mkdir -p /tmp/ada-archive-preview
          git diff > /tmp/ada-archive-preview/source.patch
          git status --short > /tmp/ada-archive-preview/files-changed.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ada-archive-five-preview
          path: /tmp/ada-archive-preview/
          if-no-files-found: warn
          retention-days: 30

      - name: Record verified archive migration on isolated release branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          release_branch=feat/archive-word-duplicates-release-20261030
          git diff --binary > /tmp/ada-five-archive-release.patch
          test -s /tmp/ada-five-archive-release.patch || { echo "::error::No archive migration diff"; exit 1; }
          if git ls-remote --exit-code --heads origin "$release_branch" > /dev/null; then
            echo "::error::Release branch already exists: review existing commit instead of duplicating it"
            exit 1
          fi
          git reset --hard HEAD
          git fetch --no-tags origin main:refs/remotes/origin/main
          git switch --detach refs/remotes/origin/main
          git apply --index --3way /tmp/ada-five-archive-release.patch
          git diff --cached --check
          echo "Validated release file list:"
          git diff --cached --name-only
          if git diff --cached --name-only | grep -Ev '^(data/catalog-archive\.json|data/catalogues/|data/external-identity/|data/seo-geo/|data/source-index/|docs/audits/|docs/catalogues/|src/content/tours/)' ; then
            echo "::error::Unexpected output outside archive migration paths"
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "archive: publish five verified duplicate tours with SEO reference cleanup"
          git push origin HEAD:refs/heads/"$release_branch"
          echo "Verified migration published to isolated branch $release_branch; main remains unchanged."
