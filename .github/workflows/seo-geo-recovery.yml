name: Recover failed SEO/GEO staging preflight

on:
  workflow_run:
    workflows: ['SEO/GEO staging link preflight']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/seo-geo-recover.mjs'
      - 'scripts/lib/seo-geo-recovery.mjs'
      - 'tests/seo-geo-recovery.test.mjs'
      - '.github/workflows/seo-geo-recovery.yml'
  schedule:
    - cron: '19 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: seo-geo-failed-preflight-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'seo-geo/staging' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            scripts/seo-geo-recover.mjs
            scripts/lib/seo-geo-recovery.mjs
            tests/seo-geo-recovery.test.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify recovery rules without contacting GitHub
        run: node --test tests/seo-geo-recovery.test.mjs
      - name: Safely restore draft and recoverable claim state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_MODE: ${{ github.event_name == 'workflow_run' && 'run' || 'scan' }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/seo-geo-recover.mjs
