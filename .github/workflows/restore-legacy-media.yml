name: Inspect tour source media references

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-legacy-media.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print first image URLs from three source tours
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          python - <<'PY'
          import re, html, subprocess
          pages={
            'luxury':'https://brasiltours.ru/roskoshnaya-braziliya',
            'bap':'https://brasiltours.ru/3-strany-latinskoj-ameriki',
            'south':'https://brasiltours.ru/tur-v-yuzhnuyu-braziliyu',
          }
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          for name,url in pages.items():
              s=subprocess.check_output(['curl','-sS','-L','-A',ua,url],text=True,errors='ignore')
              print('\n###',name,url,'len=',len(s))
              vals=[]
              for p in [
                  r'''(?:src|data-src|data-lazy|data-original|href)=["']([^"']+)["']''',
                  r'''url\((?:["']?)([^)"']+)(?:["']?)\)''',
                  r'''(?:srcset|data-srcset)=["']([^"']+)["']''',
              ]:
                  vals += re.findall(p,s,re.I)
              out=[]
              for v in vals:
                  v=html.unescape(v)
                  for part in v.split(','):
                      u=part.strip().split()[0] if part.strip() else ''
                      if u and ('/image/' in u or re.search(r'\.(?:jpg|jpeg|png|webp)(?:\?|$)',u,re.I)):
                          if u not in out: out.append(u)
              for i,u in enumerate(out[:50]):
                  print(f'{i:03d} {u}')
          PY
